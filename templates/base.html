<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ULTRON{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="topbar">

        <div class="brand">
            ULTRON
        </div>

        <div class="userbox">
            {{ session.get('username') }}
            ({{ session.get('role') }})

            <a href="{{ url_for('logout') }}">
                Logout
            </a>
        </div>

    </div>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
