<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ULTRON{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tables.css') }}">
</head>
<body>
    <div class="topbar">
        <div class="brand">ULTRON</div>
        <div class="userbox">
            {{ session.get('username') }} ({{ session.get('role') }})
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </div>
    <div class="nav">
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active_page == 'dashboard' else '' }}">Dashboard</a>
        <a href="{{ url_for('events') }}" class="{{ 'active' if active_page == 'events' else '' }}">Events</a>
        
        <a href="{{ url_for('incidents') }}" class="{{ 'active' if active_page == 'incidents' else '' }}">Incidents</a>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
